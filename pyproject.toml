[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurai-agent-runtime"
version = "0.1.0"
description = "Aurai agent runtime: durable LangGraph agents, human approval gates and an approval service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
claude-sdk = ["claude-agent-sdk>=0.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "claude-agent-sdk>=0.2"]

[project.scripts]
aurai-agents = "aurai_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aurai_agents = ["template/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
