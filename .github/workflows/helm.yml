name: helm
on:
  push: { branches: [main], paths: ["charts/**", "config/**"] }
  pull_request: { paths: ["charts/**", "config/**"] }
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Lint and render (local)
        run: |
          helm lint charts/aurai-agents -f charts/aurai-agents/values-local.yaml \
            --set-file files.agents=config/agents.yaml --set-file files.approvers=config/approvers.yaml
          helm template t charts/aurai-agents -f charts/aurai-agents/values-local.yaml \
            --set-file files.agents=config/agents.yaml --set-file files.approvers=config/approvers.yaml > /tmp/local.yaml
      - name: Render (AWS)
        run: >
          helm template t charts/aurai-agents -f charts/aurai-agents/values-aws.yaml
          --set image.repository=123456789012.dkr.ecr.us-east-1.amazonaws.com/aurai-agent-runtime
          --set-file files.agents=config/agents.yaml --set-file files.approvers=config/approvers.yaml > /tmp/aws.yaml
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/local.yaml /tmp/aws.yaml