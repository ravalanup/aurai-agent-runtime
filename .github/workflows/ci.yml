name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: aurai_agents_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AURAI_TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/aurai_agents_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }
      - run: pip install -e ".[dev]"
      - name: Connectors (for the cross-repository integration tests)
        # Optional: those tests skip themselves when the package is absent.
        run: pip install "git+https://github.com/ravalanup/aurai-mcp-connectors.git" || echo "connectors not installed"
      - run: ruff check .
      - run: ruff format --check .
      - run: aurai-agents check
        env:
          AURAI_CONFIG_DIR: config
          AURAI_APPROVAL_SIGNING_KEY: ci-only-signing-key-0123456789abcdef
      - run: pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aurai-agent-runtime:ci .
      - name: The image passes its own configuration check
        run: docker run --rm -e AURAI_APPROVAL_SIGNING_KEY=ci-only-signing-key-0123456789abcdef aurai-agent-runtime:ci check