{{- if .Values.networkPolicy.enabled }}
# kind's default network plugin does not enforce NetworkPolicy; EKS needs policy support enabled.
# Ingress only: callers must be in a platform-access namespace (or the release's own namespace, which is how the runtime
# reaches the approval service). Egress is not restricted in this prototype.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-ingress
  labels:
    {{- include "aurai-agents.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aurai-agents
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              aurai.io/platform-access: "true"
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: 8080
{{- end }}
